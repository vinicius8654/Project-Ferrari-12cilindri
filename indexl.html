  <script>
    
    function voltarPagina() {
    window.history.back();
  }
    
    const carro = document.getElementById("carro");
    const secoes = document.querySelectorAll("section");
    let imagemAtual = 0; // seção inicial
    const imagens = ["https://res.cloudinary.com/dmxgurkfj/image/upload/v1756233708/cima1_oxzv5v.png", "https://res.cloudinary.com/dmxgurkfj/image/upload/v1756233710/cima2_dou5nl.png", "https://res.cloudinary.com/dmxgurkfj/image/upload/v1756233707/cima3_zvvbyc.png", "https://res.cloudinary.com/dmxgurkfj/image/upload/v1756233705/cima4_ofcviw.png", "https://res.cloudinary.com/dmxgurkfj/image/upload/v1756233704/cima5_vlfrnm.png"];

    // Atualiza imagem do carro com fade
    function atualizarCarro(index) {
      if(index < 0 || index >= imagens.length) return;
      carro.style.opacity = "0";
      setTimeout(() => {
        carro.src = imagens[index];
        carro.style.opacity = "1";
      }, 400);
    }

    // Detecta scroll horizontal
    window.addEventListener("scroll", () => {
      let index = Math.round(window.scrollX / window.innerWidth);
      if(index !== imagemAtual){
        imagemAtual = index;
        atualizarCarro(imagemAtual);
      }
    });

  
  </script>
