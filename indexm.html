body {
      margin: 0;

    section {
      min-width: 100vw;     /* cada seção ocupa 100% da largura da tela */
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-family: Arial, sans-serif;

  body.fade-out {
  opacity: 0;
  transition: opacity 0.5s ease;
}

body.fade-in {
  opacity: 1;
  transition: opacity 0.5s ease;
}
  body {
      background: #000000;
      margin: 0;
      padding: 0;
    }

.container {
      display: flex;
      width: 400%; /* 4 páginas lado a lado */
      height: 100vh;
      transition: transform 0.8s ease-in-out;
    }

    .section {
      width: 100vw;
      height: 100vh;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 50px;
      box-sizing: border-box;
    }

    .section:nth-child(1) { background: #fff; }
    .section:nth-child(2) { background: #f4f4f4; }
    .section:nth-child(3) { background: #eaeaea; }
    .section:nth-child(4) { background: #ddd; }

    .text {
      max-width: 40%;
    }

    .text h1 {
        color: #000000;

      margin-bottom: 20px;
      background-color: white;
    }

    .text p {

      color: #333;
    }

    .img {

     .imgs {

      display: flex;
      align-items: center;
      justify-content: center;
    }

    
    .colunas {
  max-width: 800px;       /* largura máxima menor */
  column-count: 2;        /* mantém duas colunas */
  column-gap: 30px;       /* espaço entre colunas menor */
  text-align: justify;
  font-size: 14px;        /* tamanho de fonte menor */
  line-height: 1.4;       /* altura de linha mais compacta */
  position: relative;
  margin: 40px auto;      /* centralizado e com respiro */
  color: #000;
}

.btn-fechar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
  background: white;
  color: black;
  padding: 10px 18px;
  font-family: Arial, sans-serif;
  font-weight: bold;
  font-size: 16px;
  transition: all 0.3s ease;
  box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}

.btn-fechar .icon {
  background: black;
  color: white;
  font-size: 18px;
  width: 24px;
  height: 24px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
}

.btn-fechar:hover {
  transform: scale(1.05);
  box-shadow: 0 6px 15px rgba(0,0,0,0.3);
}

.btn-fechar:active {
  transform: scale(0.95);
}
