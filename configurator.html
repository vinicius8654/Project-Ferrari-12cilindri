    <script>
        // Carrega o script de autenticação e funcionalidades
        // ATENÇÃO: Em um projeto real, isso estaria em 'script.js'
        //------------------------------------------------------------------
        // Lógica de Autenticação e Favoritos (Simulada com localStorage)
        //------------------------------------------------------------------

        const DEFAULT_PROFILE_PIC = 'https://via.placeholder.com/40?text=U';
        
        function getLoggedInUser() {
            const loggedInEmail = localStorage.getItem('loggedInUser');
            if (loggedInEmail) {
                const users = JSON.parse(localStorage.getItem('users') || '{}');
                return users[loggedInEmail];
            }
            return null;
        }

        function checkAuthenticationAndSetup() {
            const user = getLoggedInUser();
            const profileImgHeader = document.getElementById('profile-img-header');
            const profileImgSidebar = document.getElementById('profile-img-sidebar');
            const profileToggleBtn = document.getElementById('profile-toggle-btn');
            
            if (user) {
                // Usuário logado: Atualiza a foto e torna o botão clicável
                const imgSource = user.profilePic || DEFAULT_PROFILE_PIC;
                profileImgHeader.src = imgSource;
                profileImgSidebar.src = imgSource;
                profileToggleBtn.onclick = toggleSidebar; // Ativa o menu lateral
                
                // Inicializa os botões de favoritos
                initializeFavoriteButtons(user.favorites);

            } else {
                // Usuário não logado: Redireciona para o login ou mantém o ícone padrão e bloqueia o menu
                profileImgHeader.src = DEFAULT_PROFILE_PIC;
                profileImgSidebar.src = DEFAULT_PROFILE_PIC;
                profileToggleBtn.onclick = () => {
                    alert('Por favor, faça login ou cadastre-se para acessar o perfil.');
                    window.location.href = 'login.html';
                };
            }
        }
        
        // Função para abrir/fechar o menu lateral
        function toggleSidebar() {
            const sidebar = document.getElementById('profile-sidebar');
            sidebar.classList.toggle('open');
        }

        // Função de Logout
        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('loggedInUser');
            alert('Você saiu da sua conta.');
            window.location.href = 'login.html'; // Redireciona para a página de login
        });


        //------------------------------------------------------------------
        // Lógica dos Favoritos (Cores e Carros)
        //------------------------------------------------------------------

        function saveFavorites(favorites) {
            const loggedInEmail = localStorage.getItem('loggedInUser');
            if (loggedInEmail) {
                const users = JSON.parse(localStorage.getItem('users'));
                users[loggedInEmail].favorites = favorites;
                localStorage.setItem('users', JSON.stringify(users));
                return true;
            }
            return false;
        }

        function toggleFavorite(type, data) {
            const user = getLoggedInUser();
            if (!user) {
                alert('Você precisa estar logado para favoritar.');
                window.location.href = 'login.html';
                return;
            }

            let favorites = user.favorites || { cars: [], colors: [] };
            
            if (type === 'car') {
                const index = favorites.cars.findIndex(c => c.name === data.name);
                if (index > -1) {
                    favorites.cars.splice(index, 1); // Remove
                    alert(`Carro ${data.name} removido dos favoritos!`);
                } else {
                    // Adiciona o carro. A URL da imagem é a da primeira imagem da seção.
                    const carSection = document.querySelector(`section[data-car-name="${data.name}"]`);
                    const imgUrl = carSection ? carSection.querySelector('img').src : '';
                    favorites.cars.push({ name: data.name, imageUrl: imgUrl }); // Adiciona
                    alert(`Carro ${data.name} favoritado!`);
                }
            } else if (type === 'color') {
                const key = `${data.carName}-${data.colorName}`;
                const index = favorites.colors.findIndex(c => c.key === key);
                if (index > -1) {
                    favorites.colors.splice(index, 1); // Remove
                    alert(`Cor ${data.colorName} do ${data.carName} removida dos favoritos!`);
                } else {
                    // Adiciona a cor. A URL da imagem é a da imagem ativa da cor.
                    const carSection = document.querySelector(`section[data-car-name="${data.carName}"]`);
                    const imgElement = carSection.querySelector(`img[data-car-color="${data.colorName}"]`);
                    const colorButton = carSection.querySelector(`button[data-color-name="${data.colorName}"]`);
                    const bgColor = colorButton ? window.getComputedStyle(colorButton).backgroundColor : '#000';
                    
                    favorites.colors.push({ 
                        key: key, 
                        carName: data.carName, 
                        colorName: data.colorName, 
                        imageUrl: imgElement ? imgElement.src : '', 
                        bgColor: bgColor // Adiciona a cor de fundo do botão
                    }); // Adiciona
                    alert(`Cor ${data.colorName} do ${data.carName} favoritada!`);
                }
            }
            
            if (saveFavorites(favorites)) {
                // Atualiza o estado dos ícones na página
                updateFavoriteIcons(favorites);
            }
        }

        function updateFavoriteIcons(favorites) {
            const favCarBtns = document.querySelectorAll('.favorite-car-btn');
            const favColorIcons = document.querySelectorAll('.fav-btn');

            // 1. Botões de Carro
            favCarBtns.forEach(btn => {
                const carName = btn.getAttribute('data-car-name');
                const icon = btn.querySelector('.car-fav-icon');
                const isFavorited = favorites.cars.some(c => c.name === carName);
                
                icon.className = isFavorited ? 'fas fa-heart car-fav-icon' : 'far fa-heart car-fav-icon';
                btn.classList.toggle('favorited', isFavorited);
            });

            // 2. Ícones de Cor
            favColorIcons.forEach(icon => {
                const carName = icon.getAttribute('data-car');
                const colorName = icon.getAttribute('data-color');
                const key = `${carName}-${colorName}`;
                const isFavorited = favorites.colors.some(c => c.key === key);

                icon.className = isFavorited ? 'fas fa-star fav-btn favorited' : 'far fa-star fav-btn';
            });
        }

        function initializeFavoriteButtons(favorites) {
            // Inicializa o estado dos ícones
            updateFavoriteIcons(favorites || { cars: [], colors: [] });

            // Event Listeners para botões de Cor
            document.querySelectorAll('.fav-btn').forEach(icon => {
                icon.addEventListener('click', (event) => {
                    event.stopPropagation(); // Impede que o clique ative a troca de cor do botão pai
                    const carName = icon.getAttribute('data-car');
                    const colorName = icon.getAttribute('data-color');
                    toggleFavorite('color', { carName, colorName });
                });
            });

            // Event Listeners para botões de Carro
            document.querySelectorAll('.favorite-car-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const carName = btn.getAttribute('data-car-name');
                    toggleFavorite('car', { name: carName });
                });
            });
        }

        //------------------------------------------------------------------
        // Lógica do Configurator (MANTIDA e Adaptada)
        //------------------------------------------------------------------
        
        function ativarGaleria(sectionSelector, buttonSelector) {
            const section = document.querySelector(sectionSelector);
            const imgs = section.querySelectorAll("img");
            const btns = section.querySelectorAll(buttonSelector);

            btns.forEach(btn => {
                btn.addEventListener("click", (event) => {
                    // Verifica se o clique foi no ícone de favorito, se sim, a troca de imagem é ignorada
                    if (event.target.classList.contains('fav-btn')) {
                        return; 
                    }
                    const index = btn.getAttribute("data-index");
                    imgs.forEach(img => img.classList.remove("active"));
                    imgs[index].classList.add("active");
                });
            });
        }

        // Inicialização
        document.addEventListener('DOMContentLoaded', () => {
            checkAuthenticationAndSetup(); // Verifica login e configura o menu/favoritos

            // Ativa as galerias existentes
            ativarGaleria(".showcase", ".color-buttons button");
            ativarGaleria(".car", ".botoes button");
            ativarGaleria(".cars", ".botoess button");

            // Fecha o sidebar ao clicar fora
            document.addEventListener('click', function(event) {
                const sidebar = document.getElementById('profile-sidebar');
                const toggleBtn = document.getElementById('profile-toggle-btn');
                if (!sidebar.contains(event.target) && !toggleBtn.contains(event.target) && sidebar.classList.contains('open')) {
                    sidebar.classList.remove('open');
                }
            });
        });

    </script>
